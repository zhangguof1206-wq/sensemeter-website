name: SEO代码回归检查

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'scripts/**', 'tools/seo/**', 'package*.json', 'next.config.*', '.github/workflows/seo-regression.yml']
  pull_request:
    paths: ['src/**', 'public/**', 'scripts/**', 'tools/seo/**', 'package*.json', 'next.config.*', '.github/workflows/seo-regression.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: 重点产品页面检查
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/seo/package-lock.json
      - name: 安装网站和独立诊断工具
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          npm ci --registry https://registry.npmjs.org
          npm ci --prefix tools/seo --registry https://registry.npmjs.org
      - name: 验证配置与现有巡检
        run: |
          npm run test:seo-tools
          npm run test:live-seo
          npm run test:daily-seo
          npm run test:rfq-application
          npm run check:rfq-email
      - name: 构建网站
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build:release
      - name: 验证中英文询盘场景与可编辑提交
        run: npm run test:rfq-browser
      - name: 检查移动端索引与体验
        env:
          SEO_TOOLS_BASE_URL: http://127.0.0.1:3219
          SEO_TOOLS_START_SERVER: '1'
        run: npm run seo:lighthouse
      - name: 保存检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-code-regression
          path: |
            artifacts/seo-tools/local/
            .lighthouseci/
          include-hidden-files: true
          retention-days: 30
      - name: 使用说明
        if: always()
        run: |
          echo '## SEO代码回归检查' >> "$GITHUB_STEP_SUMMARY"
          echo '下载 seo-code-regression 查看 HTML 报告。此检查针对本地生产构建，不等同于线上收录验证。索引关键检查失败会标红，体验评分偏低仅警告。' >> "$GITHUB_STEP_SUMMARY"
