name: 线上SEO巡检

on:
  schedule:
    - cron: "15 1 * * *"
    - cron: "15 2 * * 1"
  workflow_dispatch:
    inputs:
      full_audit:
        description: 同时运行全站和浏览器诊断（默认只运行轻量检查）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: live-seo-monitor
  cancel-in-progress: false

jobs:
  live-seo-audit:
    name: 检查线上索引信号
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 读取仓库
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 验证巡检器
        run: |
          npm run test:live-seo
          npm run test:daily-seo

      - name: 运行线上SEO巡检
        id: audit
        continue-on-error: true
        env:
          SEO_AUDIT_BASE_URL: https://sensemeter.ru
        run: node scripts/check-live-seo.mjs --output artifacts/live-seo-report.md --output-json artifacts/live-seo-report.json

      - name: 写入任务摘要
        if: always()
        run: |
          if [ -f artifacts/live-seo-report.md ]; then
            cat artifacts/live-seo-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SEO report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 保存巡检报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-seo-report
          path: |
            artifacts/live-seo-report.md
            artifacts/live-seo-report.json
          if-no-files-found: error
          retention-days: 30

      - name: 标记巡检失败
        if: steps.audit.outcome == 'failure'
        run: exit 1

  open-source-audits:
    name: 全站与重点页面诊断
    if: github.event.schedule == '15 2 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.full_audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEO_TOOLS_BASE_URL: https://sensemeter.ru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/seo/package-lock.json
      - name: 安装独立工具并校验下载
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm run seo:install
      - name: 验证工具配置
        run: npm run test:seo-tools
      - name: SiteOne低负载全站扫描
        id: siteone
        continue-on-error: true
        run: npm run seo:siteone
      - name: Unlighthouse重点询盘页面检查
        id: unlighthouse
        continue-on-error: true
        run: npm run seo:unlighthouse
      - name: 保存线上诊断报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-seo-tools
          path: artifacts/seo-tools/live/
          include-hidden-files: true
          retention-days: 30
      - name: 报告说明
        if: always()
        run: |
          echo '## 开源SEO诊断' >> "$GITHUB_STEP_SUMMARY"
          echo '下载 live-seo-tools，打开 siteone.html 查看全站问题，查看 unlighthouse 中的重点页面报告。法律页和感谢页的 noindex 属于预期行为；产品和应用页的 noindex 需要优先排查。' >> "$GITHUB_STEP_SUMMARY"
          echo '扫描聚焦 HTML，最多 500 个 URL，达到上限时仅代表部分覆盖；移动端实验室性能评分不等同于真实用户数据。扫描不会提交询盘，也不会直接提高排名。' >> "$GITHUB_STEP_SUMMARY"
      - name: 标记工具运行失败
        if: steps.siteone.outcome == 'failure' || steps.unlighthouse.outcome == 'failure'
        run: exit 1
